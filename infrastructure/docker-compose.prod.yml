# ──────────────────────────────────────────────────────────────────
# Production overlay — Caddy TLS edge, no internal ports on the host,
# resource limits, gateway trusts the proxy hop.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Required in .env: JWT_SECRET, JWT_REFRESH_SECRET, CADDY_DOMAIN, CADDY_EMAIL
# ──────────────────────────────────────────────────────────────────
services:
  caddy:
    image: caddy:2.8-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:-localhost}
      CADDY_EMAIL: ${CADDY_EMAIL:-admin@example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api-gateway: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/caddy-health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Only Caddy is reachable from outside the Docker network.
  api-gateway:
    ports: !reset []
    environment:
      TRUST_PROXY: "true"
    deploy: { resources: { limits: { cpus: "1.0", memory: 512M } } }
  identity-service:
    ports: !reset []
    deploy: { resources: { limits: { cpus: "1.0", memory: 512M } } }
  account-service:
    ports: !reset []
    deploy: { resources: { limits: { cpus: "2.0", memory: 768M } } }
  ledger-service:
    ports: !reset []
    deploy: { resources: { limits: { cpus: "0.5", memory: 256M } } }
  audit-service:
    ports: !reset []
    deploy: { resources: { limits: { cpus: "0.5", memory: 384M } } }
  quantum-service:
    ports: !reset []
    deploy: { resources: { limits: { cpus: "2.0", memory: 2G } } }
  kms-service:
    ports: !reset []
    deploy: { resources: { limits: { cpus: "0.5", memory: 256M } } }
  fraud-service:
    ports: !reset []
    deploy: { resources: { limits: { cpus: "2.0", memory: 3G } } }
  cockroachdb:
    ports: !reset []
  redis:
    ports: !reset []
  kafka:
    ports: !reset []

volumes:
  caddy_data:
  caddy_config:
